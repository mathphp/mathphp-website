name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  website:
    name: Website checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - name: Validate Composer manifest
        run: composer validate --strict
      - name: Verify the committed Composer lockfile
        run: composer validate --strict --check-lock
      - name: Install locked core dependency
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev
      - name: Check PHP syntax
        run: php -l public/index.php
      - name: Check browser script syntax
        run: node --check public/assets/site.js
      - name: Check browser rendering contract
        run: php tools/site-js-contract.php
      - name: Check container entrypoint syntax
        run: sh -n docker-entrypoint.sh
      - name: Check optional package autoload order
        run: php tools/package-autoload-contract.php
      - name: Start local HTTP smoke server
        run: |
          php -S 127.0.0.1:8080 -t public > /tmp/mathphp-smoke-server.log 2>&1 &
          echo $! > /tmp/mathphp-smoke-server.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent 'http://127.0.0.1:8080/?api=health' > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mathphp-smoke-server.log
          exit 1
      - name: Run HTTP smoke suite
        run: php tools/http-smoke.php
      - name: Stop local HTTP smoke server
        if: always()
        run: kill "$(cat /tmp/mathphp-smoke-server.pid)" 2>/dev/null || true
